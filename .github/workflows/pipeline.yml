name: Pipeline

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        uses: schubergphilis/prepare-action@v1
        with:
          type: go
          job: lint

      - name: Lint
        run: |
          task lint

  scan:
    name: Scan
    runs-on: ubuntu-22.04
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        uses: schubergphilis/prepare-action@v1
        with:
          type: go
          job: scan

      - name: Scan
        run: |
          task scan

  ci:
    name: CI
    runs-on: ubuntu-22.04
    needs: scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        uses: schubergphilis/prepare-action@v1
        with:
          type: go
          job: ci

      - name: Test
        run: |
          task test

  cd:
    name: CD
    runs-on: ubuntu-22.04
    needs: ci
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        uses: schubergphilis/prepare-action@v1
        with:
          type: go
          job: cd

      - name: Release
        run: |
          task release
